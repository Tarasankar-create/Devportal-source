{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevPortal</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --border: #212a33;
    --text: #d7dee5;
    --text-dim: #7c8a97;
    --accent: #4fd1a5;
    --accent-dim: #2a5c48;
    --status-up: #4fd1a5;
    --status-degraded: #e0b341;
    --status-down: #e05656;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  header h1 {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  header h1 span {
    color: var(--accent);
  }

  header .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  main {
    padding: 32px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .projects {
    display: grid;
    gap: 20px;
    margin-bottom: 40px;
  }

  .project-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 24px;
  }

  .project-card .project-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .project-card .project-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .env-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }

  .env-row:first-of-type {
    border-top: none;
  }

  .env-name {
    font-family: var(--mono);
    color: var(--text-dim);
    width: 110px;
    flex-shrink: 0;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.up { background: var(--status-up); box-shadow: 0 0 8px var(--status-up); }
  .dot.degraded { background: var(--status-degraded); }
  .dot.down { background: var(--status-down); }
  .dot.unknown { background: var(--text-dim); }

  .deploy-image {
    font-family: var(--mono);
    color: var(--text);
    flex: 1;
  }

  .deploy-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 13px;
    font-family: var(--mono);
    padding: 40px 0;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }

  .error-state {
    color: var(--status-down);
    font-family: var(--mono);
    font-size: 13px;
    padding: 16px;
    border: 1px solid var(--status-down);
    border-radius: 6px;
    background: rgba(224, 86, 86, 0.08);
  }
</style>
</head>
<body>

<header>
  <h1>dev<span>portal</span></h1>
  <div class="meta" id="refresh-meta">loading…</div>
</header>

<main>
  <div class="section-label">Projects &amp; Deployments</div>
  <div class="projects" id="projects-root">
    <div class="empty-state">Fetching projects…</div>
  </div>
</main>

<script>
  // Same-origin: dashboard is served by Django, so relative paths work.
  // If you split the frontend off later, replace with the full API host.
  const API_BASE = '/api';

  function statusClass(status) {
    if (!status) return 'unknown';
    const s = status.toLowerCase();
    if (['running', 'healthy', 'synced', 'up'].includes(s)) return 'up';
    if (['degraded', 'progressing', 'pending'].includes(s)) return 'degraded';
    if (['failed', 'error', 'down'].includes(s)) return 'down';
    return 'unknown';
  }

  function formatTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url} → ${res.status}`);
    return res.json();
  }

  async function loadDashboard() {
    const root = document.getElementById('projects-root');
    const meta = document.getElementById('refresh-meta');

    try {
      const [projects, environments, deployments] = await Promise.all([
        fetchJSON(`${API_BASE}/projects/`),
        fetchJSON(`${API_BASE}/environments/`),
        fetchJSON(`${API_BASE}/deployments/`),
      ]);

      if (!projects.length) {
        root.innerHTML = '<div class="empty-state">No projects yet — add one in /admin.</div>';
        meta.textContent = `updated ${formatTime(new Date().toISOString())}`;
        return;
      }

      root.innerHTML = projects.map(project => {
        const envs = environments.filter(e => e.project === project.id);

        const envRows = envs.length
          ? envs.map(env => {
              // most recent deployment for this environment
              const envDeploys = deployments
                .filter(d => d.environment === env.id)
                .sort((a, b) => new Date(b.last_synced_at || 0) - new Date(a.last_synced_at || 0));
              const latest = envDeploys[0];

              return `
                <div class="env-row">
                  <span class="dot ${statusClass(latest ? latest.status : null)}"></span>
                  <span class="env-name">${env.name}</span>
                  <span class="deploy-image">${latest ? latest.image_tag : 'no deployment'}</span>
                  <span class="deploy-time">${latest ? formatTime(latest.last_synced_at) : ''}</span>
                </div>`;
            }).join('')
          : '<div class="env-row"><span class="deploy-image" style="color: var(--text-dim)">no environments yet</span></div>';

        return `
          <div class="project-card">
            <div class="project-name">${project.name}</div>
            <div class="project-desc">${project.description || ''}</div>
            ${envRows}
          </div>`;
      }).join('');

      meta.textContent = `updated ${formatTime(new Date().toISOString())}`;
    } catch (err) {
      root.innerHTML = `<div class="error-state">Couldn't load data: ${err.message}</div>`;
      meta.textContent = 'error';
      console.error(err);
    }
  }

  loadDashboard();
  // Poll every 15s so deployment status stays current without a manual refresh.
  setInterval(loadDashboard, 15000);
</script>

</body>
</html>
